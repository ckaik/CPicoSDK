name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-deps:
    name: Download Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure cache paths
        run: echo "PICO_SDK_BUNDLE_PATH=$HOME/.pico-sdk" >> "$GITHUB_ENV"
      - name: Read Pico cache key
        id: pico-cache-key
        run: |
          echo "key=${{ runner.os }}-pico-sdk-bundle-$(jq -r '[.vars.SDK_VERSION,.vars.TOOLCHAIN_VERSION,.vars.CMAKE_VERSION,.vars.NINJA_VERSION,.vars.PICOTOOL_VERSION,.vars.OPENOCD_VERSION] | join(\"-\")' env.json)" >> "$GITHUB_OUTPUT"
      - name: Check Pico SDK bundle cache
        id: check-pico-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.PICO_SDK_BUNDLE_PATH }}
          key: ${{ steps.pico-cache-key.outputs.key }}
          lookup-only: true
      - id: setup-pico-env
        if: steps.check-pico-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-pico-env
      - name: Download Pico SDK bundle
        if: steps.check-pico-cache.outputs.cache-hit != 'true'
        run: |
          # Copy Package.swift from template so Swift package commands work.
          cp Package.swift.template Package.swift
          # Populate the shared Pico SDK cache on a cache miss so downstream
          # build jobs can restore it without re-running the prepare plugin.
          swiftly run swift package prepare-rp2xxx-environment \
              --disable-vscode-settings \
              --disable-sourcekit-lsp-settings \
              --disable-toolset \
              --disable-swift-version \
              --dump-prep-script /tmp/.env_prep \
              --cpicosdk-envs-path env.json \
              --dont-force-product-name \
              --allow-writing-to-package-directory \
              --allow-network-connections all

  build-root:
    name: Root Build
    needs: prepare-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pico-env
      - name: Run root build script
        run: |
          chmod +x build.sh
          ./build.sh

  test-root:
    name: Host Swift Tests
    needs: prepare-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pico-env
      - name: Run host Swift tests
        run: |
          CPICOSDK_HOST_TESTS=1 swiftly run swift test
      - name: Check both CMake harnesses share one btstack_config.h
        run: |
          cmp Plugins/GenerateCPicoSDKPluginTool/CMakeHarness/btstack_config.h Plugins/FinalizeBinaryPluginTool/CMakeHarness/btstack_config.h

  build-device-tests:
    name: Device Test Firmware Build (${{ matrix.target }}, ${{ matrix.build_type }})
    needs: prepare-deps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [rp2350, rp2040, pico2_w, pico_w]
        build_type: [Debug, Release, RelWithDebInfo, MinSizeRel]
    steps:
      - uses: actions/checkout@v5
      - id: setup-pico-env
        uses: ./.github/actions/setup-pico-env
      - name: Verify Pico SDK bundle cache
        run: |
          echo "pico-cache-hit=${{ steps.setup-pico-env.outputs.pico-cache-hit }}"
          echo "PICO_SDK_BUNDLE_PATH=$PICO_SDK_BUNDLE_PATH"
          test -d "$PICO_SDK_BUNDLE_PATH/sdk/$(jq -r '.vars.SDK_VERSION' env.json)"
          test -d "$PICO_SDK_BUNDLE_PATH/toolchain/$(jq -r '.vars.TOOLCHAIN_VERSION' env.json)"
          test -d "$PICO_SDK_BUNDLE_PATH/cmake/v$(jq -r '.vars.CMAKE_VERSION' env.json)"
          test -d "$PICO_SDK_BUNDLE_PATH/ninja/v$(jq -r '.vars.NINJA_VERSION' env.json)"
          test -d "$PICO_SDK_BUNDLE_PATH/openocd/$(jq -r '.vars.OPENOCD_VERSION' env.json)"
      - name: Build ${{ matrix.target }} ${{ matrix.build_type }} device test firmware
        run: |
          swiftly run swift package --disable-sandbox test-in-device --target "${{ matrix.target }}" --build-type "${{ matrix.build_type }}" --build-only --memory-map-report --allow-writing-to-package-directory --allow-network-connections all

  # The matrix above already builds BLELinkSmoke for pico_w and pico2_w. This job pins the two BLE
  # combinations explicitly and checks the linked map for the CYW43/BTstack entry points.
  build-ble-link-smoke:
    name: BLE Link Smoke (${{ matrix.target }})
    needs: prepare-deps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: pico_w
            combination: pico_w_ble
            triple: armv6m-none-none-eabi
          - target: pico2_w
            combination: pico2_w_ble
            triple: armv7em-none-none-eabi
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pico-env
      - name: Build BLELinkSmoke for ${{ matrix.combination }}
        run: |
          swiftly run swift package --disable-sandbox test-in-device --target "${{ matrix.target }}" --filter BLELinkSmoke --build-only --memory-map-report --allow-writing-to-package-directory --allow-network-connections all
      - name: Check the map for CYW43 and BTstack entry points
        run: |
          set -euo pipefail
          package=".build/plugins/TestInDevicePlugin/outputs/GeneratedDeviceTests/${{ matrix.target }}/Current"
          elf="$package/.build/${{ matrix.triple }}/debug/DeviceTestApp.elf"
          map="$package/.build/plugins/FinalizeBinaryPlugin/outputs/CMakeHarness/build_${{ matrix.combination }}/DeviceTestApp.elf.map"
          nm="$PICO_SDK_BUNDLE_PATH/toolchain/$(jq -r '.vars.TOOLCHAIN_VERSION' env.json)/bin/arm-none-eabi-nm"
          test -f "$map"
          defined="$("$nm" --defined-only "$elf" | awk '{print $3}')"
          for symbol in cyw43_arch_init cyw43_arch_poll btstack_cyw43_init cyw43_bluetooth_hci_init \
                        hci_init hci_power_control hci_get_state l2cap_init sm_init att_server_init \
                        att_db_util_init gatt_client_init le_device_db_tlv_configure \
                        btstack_run_loop_async_context_get_instance lwip_init; do
            grep -qx "$symbol" <<< "$defined" || { echo "missing $symbol"; exit 1; }
          done
          # The BT-capable Wi-Fi firmware and the BT patch replace the Wi-Fi-only blob.
          grep -q wb43439A0_7_95_49_00_combined "$map"
          grep -q cyw43_btfw_43439 "$map"

  build-example:
    name: Example Build
    needs: prepare-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pico-env
      - name: Point Example at local CPicoSDK checkout
        working-directory: Example
        run: |
          perl -0pi -e 's#\.package\(\s*url: "https://github\.com/gonzalolarralde/CPicoSDK",.*?traits:\s*\[#.package(path: "..",\n            traits: [#s' Package.swift
      - name: Run example build script
        working-directory: Example
        run: |
          chmod +x build.sh
          ./build.sh
